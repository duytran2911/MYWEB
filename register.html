<!DOCTYPE html>

<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Đăng ký</title>

    <link rel="stylesheet" href="login-register.css">
    <link rel="stylesheet" href="./css/register.css">

</head>

<body>

    <!-- NAVBAR -->

    <nav class="navbar">

        <div class="logo">MyShop</div>

        <ul class="nav-links">
            <li><a href="index.html">Trang chủ</a></li>
            <li><a href="register.html">Đăng ký</a></li>
            <li><a href="login.html">Đăng nhập</a></li>
            <li><a href="admin.html">Quản lí</a></li>
        </ul>

    </nav>

    <!-- REGISTER FORM -->

    <div class="form-container">

        <form id="register-form">

            <h2>Đăng ký tài khoản</h2>

            <div>
                <label for="inp-username">Tên đăng nhập</label>
                <input type="text" id="inp-username" required>
            </div>

            <div>
                <label for="inp-email">Email</label>
                <input type="email" id="inp-email" autocomplete="email" required>
            </div>

            <div>
                <label for="inp-pwd">Mật khẩu</label>
                <input type="password" id="inp-pwd" autocomplete="new-password" required>
            </div>

            <div>
                <label for="inp-confirm-pwd">Xác nhận mật khẩu</label>
                <input type="password" id="inp-confirm-pwd" autocomplete="new-password" required>
            </div>

            <button type="submit">Đăng ký</button>

        </form>

    </div>

    <!-- FIREBASE -->

    <script src="https://www.gstatic.com/firebasejs/12.8.0/firebase-app-compat.js"></script>

    <script src="https://www.gstatic.com/firebasejs/12.8.0/firebase-auth-compat.js"></script>

    <script src="config.js"></script>

    <script src="./js/register.js">
    </script>

</body>

</html>
